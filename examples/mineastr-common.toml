# 是否启用 MineAstr 并连接到 AstrBot。
# 不想转发聊天时改成 false。
enabled = true

# AstrBot minecraft 平台适配器的 WebSocket 地址。
# 本机运行 AstrBot 时通常保持 ws://127.0.0.1:8765/ws。
# AstrBot 在另一台机器时，把 127.0.0.1 改成那台机器的 IP 或域名。
websocketUrl = "ws://127.0.0.1:8765/ws"

# AstrBot 插件校验的 Bearer Token。
# 这里的值必须与 AstrBot minecraft 平台适配器中的 token 完全一致。
# 建议把 change-me 改成较长随机字符串，并同时填到 AstrBot 侧。
token = "change-me"

# 发送给 AstrBot 的稳定服务器 ID。
# 只有接入多个 Minecraft 服务器时才需要改；单服通常保持 minecraft。
serverId = "minecraft"

# 发送给 AstrBot 的服务器显示名称。
# 用于日志和识别，可以写成你的服务器名称。
serverName = "Minecraft 服务器"

# 独立服务器官网或介绍页；留空禁用。单人集成服务器会忽略此项。
serverIntroductionUrl = ""

# AstrBot 消息广播到 Minecraft 时显示的名称。
# 游戏内会显示为 [名称] 回复内容。
botDisplayName = "AstrBot"

# WebSocket 断开后的重连间隔，单位为秒。
# 网络不稳定时可以适当调大。
reconnectSeconds = 5

# 转发到 AstrBot 的单条玩家聊天最大长度。
# 超过这个长度的消息会被截断。
maxMessageLength = 1000

# 是否推送玩家上下线、死亡和公开成就事件。
enablePlayerPresencePush = true
enablePlayerDeathPush = true
enableAdvancementPush = true

# 是否扫描服务器 Mod、注册表、标签和运行时配方供 AstrBot 检索。
enableKnowledgeScan = true

# 是否允许 AstrBot 查询玩家生命、位置、维度、经验和状态效果。
enablePlayerStateTool = true

# 是否允许 AstrBot 查询玩家背包、快捷栏、护甲和副手。
enableInventoryTool = true

# 是否允许 AstrBot 查询玩家附近实体摘要。
enableNearbyEntitiesTool = true

# 是否允许 AstrBot 分析已加载区域的方块、建筑部件和粗略三维形状。
enableRegionTool = true

# 单次区域分析最多扫描的方块数；不会强制加载新区块。
regionMaxBlocks = 32768

# 玩家活动地区统计和环境摘要。玩家可通过 /mineastr tracking optout 退出。
enableActivityTracking = true
activitySampleSeconds = 60
environmentSampleMinutes = 30
enableAutomaticRegionFeatureScan = true
automaticRegionScanHorizontalRadius = 8
automaticRegionScanVerticalRadius = 6
activityAnalysisDays = 28
activityRetentionDays = 84
minimumRegionMinutes = 30
minimumRegionChunkMinutes = 2

# 可配置的首次加入简要告知。服务器提供者负责确认其满足实际适用规则。
enablePrivacyNotice = true
privacyNoticeText = "本服使用 MineAstr 按区块统计活动，并摘要采集玩家周边已加载方块与建筑特征；服务器还可运行 AI 玩家 Bot，并在服主显式启用后观察高信息量设备交互及非 NBT 的容器差量以学习设备用法。普通聊天和公开服务器事件也可转发给 AstrBot。不保存完整容器快照、告示牌文字或完整建筑蓝图。原始活动最多保存 {retention_days} 天。使用 /mineastr privacy 查看详情，/mineastr tracking optout 与 /mineastr learning optout 可分别退出。"
privacyNoticeVersion = "4"

# 服务端托管的 AI 玩家 Agent。首次部署建议先保持 false，通过 /mineastr agent status 检查环境。
enableAgent = false

# 要求 Node.js 22+。默认从 PATH 查找；也可以填写绝对路径。
agentNodeExecutable = "node"

# 缺少 Node 时是否下载固定且经过 SHA-256 校验的版本；默认不联网下载。
agentAutoDownloadNode = false

# offline 或 microsoft。离线身份必须配合白名单并注意同名冒用风险。
agentAccountMode = "offline"
agentUsername = "MineAstrBot"

# Mineflayer 会话策略：on_demand（默认，搭话/任务唤醒）、players_online（有人或有任务时在线）、always（常驻）。
agentSessionPolicy = "on_demand"

# 按需会话失去玩家/任务需求后延迟退出的秒数；0 表示立即退出。
agentIdleDisconnectSeconds = 60

agentServerHost = "127.0.0.1"
agentServerPort = 25565

# 默认允许 AstrBot 在服务端限制内自主下达任务；设为 false 后要求管理员审批标记。
agentFullAutonomy = true

# 同机 Bot 的 NeoForge 限定兼容层；不会关闭服务器全局网络校验。非同机地址不会启用。
agentNeoForgeCompatibility = true
agentForbiddenRegions = []

# 独立客户端实例和严格资源熔断；留空时不启用 with-mod 临时渲染。
agentClientInstancePath = ""
agentRendererMinFreeMemoryMb = 3072
agentRendererMaxMinutes = 10

# 高信息量 Mod 设备交互学习默认关闭；启用前更新告知并配置验证沙盒。
enablePassiveSkillLearning = false
skillSandboxRegion = ""

# 高风险：是否允许受控 LLM 服务器命令。默认必须保持 false，按需显式开启。
enableCommandTool = false

# 可信请求者的 Minecraft UUID、玩家名或 AstrBot 用户 ID，建议优先填写 UUID。
trustedCommandUsers = []

# 普通规则为精确匹配；以 " *" 结尾表示允许参数；单独 "*" 表示允许全部命令。
allowedCommandRules = ["list", "seed", "time query day", "time query daytime", "time query gametime"]

# 命令执行权限等级。白名单和可信用户检查始终优先。
commandPermissionLevel = 4

# 单条受控命令最大长度。
commandMaxLength = 256
