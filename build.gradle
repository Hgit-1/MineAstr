plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def spikeOnly = providers.gradleProperty('serverEntitySpikeOnly').map { it.toBoolean() }.getOrElse(false)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

var spikeTemplates = tasks.register('prepareSpikeTemplates', Copy) {
    from 'src/gameTest/structures'
    into 'run/spike-tests/gameteststructures'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(layout.buildDirectory.dir('generated/agentResources'))
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def agentSourceDir = layout.projectDirectory.dir('src/agent')
def agentInstallDir = layout.buildDirectory.dir('agent-runtime')

tasks.register('installAgentDependencies', Exec) {
    inputs.files(fileTree(agentSourceDir) {
        include '*.js', 'package.json', 'package-lock.json'
    })
    outputs.dir(agentInstallDir.map { it.dir('node_modules') })
    workingDir agentSourceDir
    commandLine 'npm', 'ci', '--omit=dev', '--ignore-scripts', '--no-audit', '--no-fund'
    doFirst {
        copy {
            from agentSourceDir
            include '*.js', 'package.json', 'package-lock.json'
            into agentInstallDir
        }
    }
    doLast {
        copy {
            from agentSourceDir.dir('node_modules')
            into agentInstallDir.map { it.dir('node_modules') }
        }
    }
}

tasks.register('patchAgentDependencies', Exec) {
    dependsOn tasks.named('installAgentDependencies')
    inputs.file(agentSourceDir.file('patch-pathfinder.js'))
    outputs.file(agentInstallDir.map { it.file('node_modules/mineflayer-pathfinder/lib/move.js') })
    workingDir agentSourceDir
    commandLine 'node', 'patch-pathfinder.js'
    doLast {
        copy {
            from agentSourceDir.dir('node_modules/mineflayer-pathfinder')
            into agentInstallDir.map { it.dir('node_modules/mineflayer-pathfinder') }
        }
    }
}

tasks.register('packageAgentRuntime', Zip) {
    dependsOn tasks.named('patchAgentDependencies')
    archiveFileName = 'runtime.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/agentResources/mineastr-agent')
    from agentInstallDir
    exclude '**/test/**', '**/tests/**', '**/examples/**', '**/.github/**', '**/*.md', '**/*.map'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources').configure {
    if (spikeOnly) {
        exclude 'mineastr-agent/**'
    } else {
        dependsOn tasks.named('packageAgentRuntime')
    }
}

if (spikeOnly) {
    tasks.named('jar').configure {
        archiveClassifier = 'entity-spike'
        exclude 'mineastr-agent/**'
    }
}

repositories.clear()
repositories {
    mavenLocal()
    maven {
        name = "HuaweiCloudMaven"
        url = uri("https://repo.huaweicloud.com/repository/maven/")
    }
    maven {
        name = "TencentCloudMaven"
        url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/")
    }
    maven {
        name = "NeoForged Releases"
        url = uri("https://maven.neoforged.net/releases/")
    }
    maven {
        name = "Mojang Meta"
        url = uri("https://maven.neoforged.net/mojang-meta/")
    }
    maven {
        name = "Mojang Minecraft Libraries"
        url = uri("https://libraries.minecraft.net/")
    }
    mavenCentral()
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/spike-tests')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore spikeTemplates
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// NeoForge injects the transformed Minecraft classes into main only; activity SavedData tests need the same classes.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('packageServerEntitySpike', Zip) {
    dependsOn tasks.named('jar'), tasks.named('test'), tasks.named('runGameTestServer')
    archiveFileName = "mineastr-${project.version}-entity-spike.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(tasks.named('jar')) { into 'mods' }
    from('README.md')
    from('cover.png')
    from('LICENSE')
    from('docs/decisions/0001-server-entity-spike.md') { into 'docs/decisions' }
    from('examples/mineastr-entity-spike.toml') { into 'examples' }
    doFirst {
        if (!spikeOnly) throw new GradleException('Use -PserverEntitySpikeOnly=true for the experimental ZIP')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
