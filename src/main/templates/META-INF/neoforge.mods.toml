modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="MineAstr"
displayTest="IGNORE_ALL_VERSION"
description='''
MineAstr 将 Minecraft 服务器聊天接入 AstrBot，让游戏内对话表现为同一个 AstrBot 群聊。

基础功能只需要服务端安装：玩家聊天会转发到 AstrBot，AstrBot 的文本回复会广播回游戏；机器人还可以查询服务器状态、玩家状态、背包、附近实体和已加载区域的建筑特征。

服务器命令工具默认关闭，并受到可信用户、命令白名单和审计日志三重保护；服务器管理员必须显式配置后才能使用。

如果玩家客户端也安装 MineAstr，可以按玩家隐私设置请求受控截图，用于“看看我现在画面”等工具调用场景。默认截图策略为先询问玩家。

本 Mod 支持 NeoForge 独立服务端无 GUI 运行；未安装客户端 Mod 的玩家仍可加入服务器，只是不提供截图等客户端附加能力。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
